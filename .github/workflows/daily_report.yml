name: Pitinvest Hourly Update

on:
  schedule:
    - cron: '0 * * * 1-5'   # 평일 매시 정각 (UTC 기준)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # v3에서 v4로 최신화 완료!
      - name: Set up Python
        uses: actions/setup-python@v5 # v4에서 v5로 최신화 완료!
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run main script
        env:
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_TOKEN:  ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID:         ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: 커밋 및 푸시 (데이터 자동 업데이트)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pitinvest_history.csv current_snapshot.json master_data.json expert_analysis_cache.json video_analysis_history.json rs_monitor.json
          git commit -m "📈 데이터 + 스냅샷 + 전문가분석 자동 업데이트" || echo "저장할 변경사항이 없습니다."
          git push
