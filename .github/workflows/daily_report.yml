name: Pitinvest Hourly Update

on:
  schedule:
    # GHA schedule은 best-effort라 자주 skip. 매시간 안에 3번 시도(7/27/47분)해서
    # 1개라도 잡힐 확률 ↑ (실제 매시간 보장은 cron-job.org 같은 외부 트리거 필요).
    # 매시 7·27·47분(UTC). GHA cron 요일필터는 UTC라 1-5를 쓰면 월요일 아침 KST가 빠짐 → 매일 실행.
    # 주말은 종가 변화 없어 무해(변화없음 커밋/스킵). 지표·스냅샷은 매시간 갱신.
    # 전문가 분석(Gemini)은 main.py 내부에서 KST 09·13시대에만 실행(EXPERT_RUN_HOURS) → 하루 2번.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # v3에서 v4로 최신화 완료!
      - name: Set up Python
        uses: actions/setup-python@v5 # v4에서 v5로 최신화 완료!
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run main script
        env:
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_TOKEN:  ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID:         ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: 커밋 및 푸시 (데이터 자동 업데이트)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pitinvest_history.csv current_snapshot.json master_data.json expert_analysis_cache.json video_analysis_history.json rs_monitor.json
          git commit -m "📈 데이터 + 스냅샷 + 전문가분석 자동 업데이트" || echo "저장할 변경사항이 없습니다."
          git push
